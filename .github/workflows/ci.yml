# ============================================
# CI Pipeline — auto-run on every push & PR
# ============================================
# Prevents merging code that:
#   - Fails the syntax check
#   - Fails unit tests
#   - Breaks the behavior of existing functions
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint (ESLint)
        run: npm run lint
        continue-on-error: true # soft-fail for now; will be made strict once the codebase is clean

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Upload coverage artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            .nyc_output/
          if-no-files-found: ignore
          retention-days: 7
